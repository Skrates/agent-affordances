[project]
name = "hive-attention"
version = "0.1.0"
description = "Thin launcher: `hive-attention …` forwards verbatim to the installed `hive attention …`"
readme = "README.md"
requires-python = ">=3.13"
# Forwarding only: no HTTP client, schema, database, sorting or retry logic lives here, so
# there is nothing for Typer or httpx to do. Hive owns every attention rule.
dependencies = []

[project.scripts]
hive-attention = "hive_attention.cli:main"

[dependency-groups]
# ruff/ty are deliberately not dev deps: the Weave-wide version authority is
# weave-doctrine's mise.toml (bare binaries on PATH via mise shims).
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_attention"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
